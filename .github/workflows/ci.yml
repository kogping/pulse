name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Placeholders only. packages/db/src/env.ts validates shape at
          # import time (invariant: throws at boot on a missing var), and
          # `next build` imports every route module during page-data
          # collection — but nothing here executes a real query. Real
          # values live in Neon/Upstash and are injected by Vercel at
          # runtime for actual deployments; see docs/infra/provisioning.md.
          DATABASE_URL: "postgresql://ci:ci@ci.invalid/ci"
          UPSTASH_REDIS_REST_URL: "https://ci.invalid"
          UPSTASH_REDIS_REST_TOKEN: "ci-placeholder"
